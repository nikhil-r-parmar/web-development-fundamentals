
<!-- Welcome to HTML (HyperText Markup Language) which is used to create structure of webpages.-->

<!-- Here each element is inside an tag - every tag has it's own meaning. -->

<!-- This text is a comment tag - web browser ignores it. in html, single line and multiline comments are same. -->

<!-- Just type the emmet (!), and it generates this boilerplate code for you-->

<!DOCTYPE html>     <!-- It tells the browser which version of html you are using. -->
<html lang="en">    <!-- This is an root tag - it wraps all the content & tags of your webpage. -->



<!-- Important metadata is goes inside head tags. -->
<!-- Contant inside head tag is not gonna visible on webpage. -->
<head>

    <meta charset="UTF-8">  <!-- it sets the character encoding for your website. -->
    <!--Why it matters: UTF-8 is the universal standard for text on the internet. It includes almost every character, punctuation mark, and emoji from almost every language in the world.-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- It controls how the page is rendered on mobile devices -->
    <!-- This line is the foundation of responsive web design. -->

    <title>COMMENTS</title>     <!-- It defines the title of your webpage which is shown on your browser tag. -->

</head>



<!-- This body contains all the content of webpage-->
<body>
        Hello World!
        <!-- Here you can write your alll content that gonna be shown on browser screen, just like headings, paragraphs, images, lists, tables etc.. -->
</body>


</html>

<!-- html is not case sensitive, writing html tags in smaller case is a good practice. -->
