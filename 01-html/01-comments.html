
<!-- Welcome to HTML (HyperText Markup Language) which is used to create structure of webpages.-->

<!-- Here each element is inside an tag - every tag has it's own meaning. -->

<!-- This text is a comment tag - web browser ignores it. in html, single line and multiline comments are same. -->

<!-- Just type the emmet (!), and it generates this boilerplate code for you-->

<!DOCTYPE html>     <!-- This doctype tells the document type. -->
<html lang="en">    <!-- This is an root tag of html. -->

<!-- This head tag's are known as metadata. -->
<!-- Contant inside head tag is not gonna visible on webpage. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMENTS</title>     <!-- It defines the title of your webpage which is shown on your browser tag. -->
</head>

<!-- This body contains all the content of webpage-->
<body>
        Hello World!
        <!-- Here you can write your alll content that gonna be shown on browser screen -->
</body>
</html>

<!-- html is not case sensitive, writing html tags in smaller case is a good practice. -->
