<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Entity</title>
</head>
<body>
    
    <!-- html character entities are used to show reserved keywords of html on browser. -->

    <!-- An HTML entity, or character reference, is a set of characters used to represent a reserved character in HTML. -->

    <!-- It starts with & and ends with ;. -->

    &nbsp;  <!-- This for non breaking space. -->
    &copy;  <!-- This for copyright symbol. -->
    &hearts;    <!-- This for heart imoji. -->
    &dollar;    <!-- This for dollor sign. -->

    <!-- and more like these are there. -->

    <!-- for tags : lt & gtare used, example: -->
     <p>&lt;p&gt; Learnig is a fun &lt;p&gt;</p>

</body>
</html>
