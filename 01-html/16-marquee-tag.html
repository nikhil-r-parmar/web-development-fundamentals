<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee Tag</title>
</head>
<body>
    
    <!-- the marquee tag is used to scroll content horizontally or vertically. -->

    <marquee behavior="alternative" direction="up">DOWN TO UP</marquee>

    <marquee behavior="alternative" direction="down">TOP TO DOWN</marquee>

    <marquee behavior="alternative" direction="right">LEFT TO RIGHT</marquee>

    <marquee behavior="alternative" direction="left">RIGHT TO LEFT</marquee>

    <!-- this tag is no more in html5. -->

</body>
</html>
