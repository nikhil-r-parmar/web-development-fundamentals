
<!-- implementing Unordered list -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    
    <!-- Unordered list is used to show content without an order. -->
     <!-- Just like in some bullets and points. -->

    <h3>Fruits</h3>

    <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>


    <h3>Hobbies</h3>

    <ul type="square">
        <li>Cricket</li>
        <li>Coding</li>
        <li>Gaming</li>
        <li>Being Happy</li>
    </ul>

</body>
</html>
