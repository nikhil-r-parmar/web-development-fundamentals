
<!-- iframe element tag. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Tag</title>
</head>
<body>

    <!-- This element stands for inline frame. (iframe)-->

    <!-- It's an inline element used to embed other HTML content directly within the HTML page. That HTML content could be a video, map, another HTML element, or even other web pages. -->

    <iframe src="https://www.youtube.com/watch?v=Jm7Satp7Zqk&list=RDjMqSO4S-Q9E&index=27" 
    width="400px"
    height="400px"
    allowfullscreen
    title="PARION SA FULL HINDI SONG"
    allow="autoplay">   <!-- what user can do with iframe - allowlist-->
    </iframe>
    
</body>
</html>
