<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes</title>
</head>
<body>

    <!-- An attribute is a value placed inside the opening tag of an HTML element. Attributes provide additional information about the element or specify how the element should behave. -->

    <a href="https://youtube.com" target="_blank">Open Youtube</a><br>
    <!-- here 'href' and 'target' are attributes. The href attribute specifies the URL of a link and the target attribute specifies where to open the link. -->


    <img src="../assets/mars.jpg" alt="Mars Images"/><br>
    <!-- here two attributes are the src and alt, or alternative, attributes, which are used to specify the source of an image and provide alternative descriptive text for the image, respectively.-->


    <!-- boolean attributes -->
     <input type="checkbox" checked><br>    <!-- checkbox is checked by default. -->
     <input type="checkbox" disabled>   <!-- checkbox is disabled - you cannot touch it. -->

     <!-- just like that, there are many types of attributes in html. -->
    
</body>
</html>
