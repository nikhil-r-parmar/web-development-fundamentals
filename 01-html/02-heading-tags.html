
<!-- The heading tags are used to show text as headings. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading Tags</title>
</head>
<body>
    
    <!-- Total there are 6 heading tags <h1> to <h6>. -->

    <h1>Heading 1</h1>  <!-- This is the biggest heading. -->
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>  <!-- This is the smallest heading -->

</body>
</html>
