
<!-- Understanding difference between block and inline elements. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and Inline Elements. </title>
</head>
<body>
    
    
    <!-- Block Elements: -->
    <!-- Each element is starts with new line and size is automatically set. -->

    <div>   <!-- 1. <div> tag : It is used to devide all content of webpage into containers. -->
        <p>This is a Paragraph</p>      <!-- 2. <p> tag -->
        <h1>This is heading</h1>    <!-- 3. all heading tags. -->

        <ol>ordered list    <!-- 4. all list related tags. -->
            <li>list</li>
        </ol>     
    </div>


    <br><hr><br>


    <!-- Inline Elements: -->
    <!-- No new line between elements and adjust size just as wide as content (not automatic). -->

    <a href="#">Fist Hyperlink</a><span>Nikhil</span><a href="#">Second Hyperlink</a>   <!-- Both on same line. -->
    <!-- Span is different but also it stays on same line. -->
    <br>
    <img src="../assets/mars.jpg" alt=""><img src="../assets/mars.jpg" alt="">  <!-- Both images on same line. -->

</body>
</html>
