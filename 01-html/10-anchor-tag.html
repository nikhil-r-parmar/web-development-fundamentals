
<!-- Implementation of Anchor Tag. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tag</title>
</head>
<body><hr><br>

    <!-- The Anchor Tag is used to give hyperlinks to webpages. -->

    <a href="06-video-tag.html" target="_blank"> <b>VISIT VIDEO TAG PAGE</b> </a>

    <!-- here 'href' is used to give the path of link-->

    <!-- target blank means the nextpage is opening in new tab. and by default it opens it in same tab. -->

    <hr><br>

    <h3><a href="https://youtube.com">Youtube</a></h3>
    <h3><a href="https://instagram.com">Instagram</a></h3>
    
</body>
</html>
