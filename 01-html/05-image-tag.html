
<!-- To add your images in webpage, the <img> tag is used. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGE TAG</title>
</head>
<body>
    
    <img src="../assets/mars.jpg" alt="Mars image" width="500px">
    <!-- Here with image tag, src attribute is used to give the path of your image. -->
    <!-- alt attribute shows alternative text if image is not shown for any reason. -->
    <!-- height/width attributes are used to adjust size of images on your webpage. -->


    <!-- you can also import images from internet anywhere. -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRj1BHCbnijU-dUK-t6anlCtlOct0SVob-EepPCwwUweA&s" width="300px" alt="Doraemon image">

</body>
</html>
