
<!-- the audio tag is used to add audio file to your webpages. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Tag</title>
</head>
<body>
    
    <audio controls >
        <source src="../assets/audio.mp3" type="audio/mp3">     <!-- here src is used to give path of audio file & inside type you give that file. -->
    </audio>

    <!-- Here inside audio tag we have to use another source tag to give the audio file source. -->

    <!-- just like image and video, you can also use multiple attributes with audio tag.-->

</body>
</html>
