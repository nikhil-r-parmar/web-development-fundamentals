<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<body>

    <header>
        <h1 id="title">Survey Form</h1>
        <p id="description">Thank you for taking the time to help us improve the platform</p>
    </header>

    <main>
        <form action="#" id="survey-form">
            
            <fieldset>
                <legend>Personal Details</legend>
                
                <label id="name-label" for="name">Name </label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

                <label id="email-label" for="email">Email </label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

                <label id="number-label" for="number">Age (optional) </label>
                <input type="number" id="number" name="age" min="10" max="120" placeholder="Age"><br>
            </fieldset>

            <fieldset>
                <legend>Current Role</legend>
                <label for="dropdown">Which option best describes your current role?</label>
                <select name="dropdown" id="dropdown">
                    <option value="" selected disabled>Select Current role</option>
                    <option value="student">Student</option>
                    <option value="full-time-job">Full Time Job</option>
                    <option value="full-time-learner">Full Time Learner</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Would you recommend freeCodeCamp to a friend?</legend>
                
                <label for="definitely">
                    <input type="radio" id="definitely" name="recommend" value="definitely"> Definitely
                </label><br>
                
                <label for="maybe">
                    <input type="radio" id="maybe" name="recommend" value="maybe"> Maybe
                </label><br>
                
                <label for="not-sure">
                    <input type="radio" id="not-sure" name="recommend" value="not-sure"> Not sure
                </label>
            </fieldset>

            <fieldset>
                <legend>What would you like to see improved? (Check all that apply)</legend>
                <label for="front-end">
                    <input type="checkbox" id="front-end" name="prefer" value="front-end"> Front-end Projects
                </label><br>
                
                <label for="back-end">
                    <input type="checkbox" id="back-end" name="prefer" value="back-end"> Back-end Projects
                </label><br>
                
                <label for="data-visualization">
                    <input type="checkbox" id="data-visualization" name="prefer" value="data-visualization"> Data Visualization
                </label>
            </fieldset>

            <fieldset>
                <legend>Any comments or suggestions?</legend>
                <label for="comments">Leave your feedback:</label><br>
                <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Enter your comment here..."></textarea>
            </fieldset>

            <button type="submit" id="submit">Submit</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Survey Form Project</p>
    </footer>
    
</body>
</html>
