
<!-- implementing orderd list -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered List</title>
</head>
<body>
    
    <!-- Ordered list is used to show content is some orders. -->
     <!-- A-Z, a-z, 1,2..., i,ii... and more-->

    <h3>Counting</h3>

    <ol type="1">    <!-- ol stands for ordered list. -->

        <li>One</li>   <!-- li is used to give list items. -->
        <li>Two</li>
        <li>Three</li>
        <li>Four</li>
        <li>Five</li>

        <ol type="I">    <!-- nested ordered list. -->
            <li>5.1</li>
            <li>5.2</li>
            <li>5.3</li>
            <li>5.4</li>
        </ol>

        <li>Six</li>
        <li>Seven</li>
    </ol>

</body>
</html>
