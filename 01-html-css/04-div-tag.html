
<!-- also there is a concept of nesting tags - tag inside an tag. -->
<!-- The <div> tag is known as devider and it is used to devide html tags into containers. -->
<div>

  <h1>Humans have reached Mars</h1>
  <!-- This h1 tag is used to show headings -->

  <img src="mars.jpg" width="100%" />
  <!-- This img tag is used to import images -->
  <!-- the width/height attributes are used to adjust size of the image. -->
  <!-- src is used to give the path of image. -->

  <h3>
    The Starship rocket successfully landed on the red planet this morning.
  </h3>
  <!-- just like h1, h3 is used to show smaller headings (sub-headings)-->

  <p>
    After a 115 days long journey, the crew of 12 finally arrived at their
    destination. This is the first time humans have set foot on a planet other
    than Earth.
  </p>
  <!-- This <p> tag is used to show paragraphs -->
  <img
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSs28EoDIu-Ydx_K-0k39eGPjxUldyv_bGVE3dQDZU_Yg&s=10"
    width="100%"
  />
</div>
